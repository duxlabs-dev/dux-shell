name: Sync flake.lock to submodules

on:
  workflow_dispatch:
  push:
    paths:
      - "dux-qml-common"
      - "dux-qt-base"
    branches:
      - master
      - "stable-*"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Point flake inputs at the submodule commits
        run: |
          set -euo pipefail
          sync_input() {
            local input=$1 submodule=$2 submodule_rev flake_rev
            submodule_rev=$(git ls-tree HEAD "$submodule" --object-only)
            flake_rev=$(python3 -c "import json, sys; print(json.load(open('flake.lock'))['nodes'][sys.argv[1]]['locked']['rev'])" "$input")
            [ "$submodule_rev" = "$flake_rev" ] && { echo "$input already matches $submodule_rev"; return 0; }
            nix flake lock --override-input "$input" "github:duxlabs-dev/$submodule/$submodule_rev"
          }
          sync_input dank-qml-common dux-qml-common
          sync_input dux-qt-base dux-qt-base

      - name: Commit and push flake.lock update
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          if git diff --quiet flake.lock; then
            echo "No changes to flake.lock"
            exit 0
          fi
          git config user.name "dux-ci[bot]"
          git config user.email "344434142+dux-ci[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "nix: sync flake.lock to submodules"
          git pull --rebase origin ${{ github.ref_name }}
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
