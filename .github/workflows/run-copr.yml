name: DMS Copr Stable Release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build'
        required: false
        default: 'dms'
        type: choice
        options:
          - dms
      version:
        description: 'Versioning (e.g., 1.0.3, leave empty for latest release)'
        required: false
        default: ''
      release:
        description: 'Release number (e.g., 1, 2, 3 for hotfixes)'
        required: false
        default: '1'
      owners:
        description: 'Copr owners to publish to'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - duxlabs
          - avengemedia

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Plan owners and version
        id: plan
        env:
          OWNERS: ${{ inputs.owners || 'all' }}
          PACKAGE: ${{ inputs.package || 'dms' }}
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release || '1' }}
        run: |
          MATRIX=$(jq -cn --arg owners "$OWNERS" --arg pkg "$PACKAGE" '
            [{owner: "duxlabs", suffix: ""}, {owner: "avengemedia", suffix: "_LEGACY"}]
            | map(select($owners == "all" or .owner == $owners) | .package = $pkg)
            | {include: .}')

          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sL "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not determine the latest release of ${{ github.repository }}"
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Building $PACKAGE $VERSION-$RELEASE for: $(jq -r '[.include[].owner] | join(", ")' <<< "$MATRIX")"

  build-and-upload:
    name: ${{ matrix.package }} to ${{ matrix.owner }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE: ${{ needs.plan.outputs.release }}
      PACKAGE: ${{ matrix.package }}
      COPR_PROJECT: ${{ matrix.owner }}/dms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm wget curl jq gzip python3-pip
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

      - name: Download release assets
        run: |
          cd ~/rpmbuild/SOURCES
          wget "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/dms-qml.tar.gz" || {
            echo "::error::Failed to download dms-qml.tar.gz for v${VERSION}"
            exit 1
          }
          ls -lh

      - name: Generate stable spec file
        run: |
          SPEC=~/rpmbuild/SPECS/${PACKAGE}.spec
          cp "distro/fedora/${PACKAGE}.spec" "$SPEC"
          sed -i -e "s/VERSION_PLACEHOLDER/${VERSION}/g" \
            -e "s/RELEASE_PLACEHOLDER/${RELEASE}/g" \
            -e "s/CHANGELOG_DATE_PLACEHOLDER/$(date '+%a %b %d %Y')/g" "$SPEC"
          head -40 "$SPEC"

      - name: Build SRPM
        id: build
        run: |
          rpmbuild -bs ~/rpmbuild/SPECS/${PACKAGE}.spec
          SRPM=$(ls ~/rpmbuild/SRPMS/${PACKAGE}-*.src.rpm | tail -n 1)
          echo "srpm_path=$SRPM" >> "$GITHUB_OUTPUT"
          echo "srpm_name=$(basename "$SRPM")" >> "$GITHUB_OUTPUT"
          rpm -qpi "$SRPM"

      # Per-owner name: two legs uploading the same artifact name get a 409.
      - name: Upload SRPM artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.package }}-stable-srpm-${{ needs.plan.outputs.version }}-${{ matrix.owner }}
          path: ${{ steps.build.outputs.srpm_path }}
          retention-days: 90

      - name: Install Copr CLI
        env:
          COPR_LOGIN: ${{ secrets[format('COPR_LOGIN{0}', matrix.suffix)] }}
          COPR_TOKEN: ${{ secrets[format('COPR_TOKEN{0}', matrix.suffix)] }}
        run: |
          : "${COPR_LOGIN:?COPR_LOGIN${{ matrix.suffix }} is not set}" "${COPR_TOKEN:?COPR_TOKEN${{ matrix.suffix }} is not set}"
          pip3 install copr-cli
          mkdir -p ~/.config
          umask 077
          printf '[copr-cli]\nlogin = %s\nusername = %s\ntoken = %s\ncopr_url = https://copr.fedorainfracloud.org\n' \
            "$COPR_LOGIN" "${{ matrix.owner }}" "$COPR_TOKEN" > ~/.config/copr

      - name: Upload to Copr
        run: |
          SRPM="${{ steps.build.outputs.srpm_path }}"
          echo "Uploading $(basename "$SRPM") to ${COPR_PROJECT}"
          BUILD_OUTPUT=$(copr-cli build "$COPR_PROJECT" "$SRPM" --nowait 2>&1)
          echo "$BUILD_OUTPUT"

          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'Build was added to.*\K[0-9]+' || echo "unknown")
          if [ "$BUILD_ID" != "unknown" ]; then
            echo "https://copr.fedorainfracloud.org/coprs/${COPR_PROJECT}/build/$BUILD_ID/"
          else
            echo "::warning::Could not extract build ID, but upload may have succeeded"
          fi

      - name: Build summary
        if: always()
        run: |
          {
            echo "### ${PACKAGE} stable to ${{ matrix.owner }}"
            echo ""
            echo "- **Version:** ${VERSION}-${RELEASE}"
            echo "- **SRPM:** ${{ steps.build.outputs.srpm_name }}"
            echo "- **Project:** https://copr.fedorainfracloud.org/coprs/${COPR_PROJECT}/"
          } >> "$GITHUB_STEP_SUMMARY"
