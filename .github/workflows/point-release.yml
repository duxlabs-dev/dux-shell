name: Release

# Bumps quickshell/VERSION, tags, and dispatches the Build release workflow.
# X.Y.0 is cut from master (the tag push makes dms-stable.yml cut stable-X.Y);
# X.Y.Z from stable-X.Y after a warn-only port audit.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (2.1.0 from master, 2.1.1 from stable-2.1)"
        required: true
        type: string
      notify_issues:
        description: "Comment on open related/fixes issues asking reporters to retest"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: point-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version and derive branch
        id: derive
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (got '$VERSION')"; exit 1
          fi
          branch="stable-${VERSION%.*}"
          [[ "$VERSION" == *.0 ]] && branch=master
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.derive.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Preflight — verify Build release workflow is dispatchable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/release.yml" \
            --jq '.state' | grep -qx active ||
            { echo "::error::release.yml is not dispatchable; aborting before any push"; exit 1; }

      - name: Check master is on this release line
        if: steps.derive.outputs.branch == 'master'
        run: |
          set -euo pipefail
          current=$(cat quickshell/VERSION)
          [[ "${current#v}" == "${VERSION%.*}"-* ]] ||
            { echo "::error::master is at ${current}, not on the ${VERSION%.*} line"; exit 1; }

      - name: Port audit (informational)
        if: steps.derive.outputs.branch != 'master'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          bash scripts/port-audit.sh "${{ steps.derive.outputs.branch }}" ||
            echo "::warning::port audit failed; continuing"

      - name: Bump VERSION, tag, and push
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TAG: ${{ steps.derive.outputs.tag }}
          BRANCH: ${{ steps.derive.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"; exit 1
          fi
          git config user.name "dux-ci[bot]"
          git config user.email "344434142+dux-ci[bot]@users.noreply.github.com"

          echo "${TAG}" > quickshell/VERSION
          git add quickshell/VERSION
          git commit -m "bump VERSION to ${TAG}"
          git tag "${TAG}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${BRANCH}" "refs/tags/${TAG}"

      - name: Dispatch Build release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref "${{ steps.derive.outputs.tag }}" \
            -f tag="${{ steps.derive.outputs.tag }}" \
            -f notify_issues="${{ inputs.notify_issues }}"

      - name: Next steps
        run: |
          {
            echo "## ${{ steps.derive.outputs.tag }} tagged on ${{ steps.derive.outputs.branch }} — Build release workflow dispatched"
            echo ""
            echo "Distro builds (COPR/OBS/PPA/XBPS) are dispatched by the Build release workflow once the release is published."
            if [ "${{ steps.derive.outputs.branch }}" = master ]; then
              echo ""
              echo "stable-${VERSION%.*} is cut by dms-stable.yml from the tag. Bump master to the next beta and disable the changelog popup by hand."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
